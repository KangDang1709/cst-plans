<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}Rung Chuông Vàng</title>
  <style>
    :root {
      --bg: #ffffff; --text: #1f2328; --muted: #59636e; --line: #d1d9e0;
      --soft: #f6f8fa; --accent: #b8860b; --accent-bg: #fff8e1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --text: #e6edf3; --muted: #9198a1; --line: #30363d;
        --soft: #161b22; --accent: #f0c040; --accent-bg: #2a2410;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.6 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      background: var(--bg); border-bottom: 1px solid var(--line);
    }
    .topbar-inner {
      max-width: 960px; margin: 0 auto; padding: 0 16px;
      display: flex; align-items: center; gap: 16px; overflow-x: auto;
    }
    .brand { font-weight: 700; white-space: nowrap; padding: 14px 0; }
    .tabs { display: flex; gap: 4px; }
    .tabs a {
      display: block; padding: 14px 12px; white-space: nowrap;
      color: var(--muted); text-decoration: none; border-bottom: 3px solid transparent;
    }
    .tabs a:hover { color: var(--text); }
    .tabs a.active { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
    h1, h2, h3 { line-height: 1.3; scroll-margin-top: 72px; }
    h1 { margin-top: 8px; }
    h2 { margin-top: 40px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
    a { color: var(--accent); }
    code { background: var(--soft); padding: 2px 5px; border-radius: 4px; font-size: 0.9em; }
    pre { background: var(--soft); padding: 12px 14px; border-radius: 6px; overflow-x: auto; }
    pre code { background: none; padding: 0; }
    table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; margin: 16px 0; }
    th, td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; vertical-align: top; }
    th { background: var(--soft); }
    blockquote { margin: 16px 0; padding: 8px 16px; background: var(--accent-bg); border-left: 4px solid var(--accent); }
    .mermaid { background: #fff; border-radius: 6px; padding: 12px; overflow-x: auto; }
  </style>
</head>
<body>
  {% assign here = page.url | replace: 'index.html', '' %}
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">🔔 Rung Chuông Vàng</span>
      <nav class="tabs">
        <a href="{{ '/' | relative_url }}" {% if here == '/' %}class="active"{% endif %}>Start here</a>
        <a href="{{ '/contract.html' | relative_url }}" {% if here == '/contract.html' %}class="active"{% endif %}>Contract</a>
        <a href="{{ '/backend.html' | relative_url }}" {% if here == '/backend.html' %}class="active"{% endif %}>Backend</a>
        <a href="{{ '/web.html' | relative_url }}" {% if here == '/web.html' %}class="active"{% endif %}>Teacher web</a>
        <a href="{{ '/unity.html' | relative_url }}" {% if here == '/unity.html' %}class="active"{% endif %}>Student app</a>
      </nav>
    </div>
  </header>
  <main>
    {{ content }}
  </main>
  <script type="module">
    // Draw ```mermaid blocks as diagrams (GitHub Pages shows them as plain code otherwise).
    const blocks = document.querySelectorAll('pre > code.language-mermaid');
    if (blocks.length) {
      const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs');
      blocks.forEach(code => {
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = code.textContent;
        code.parentElement.replaceWith(div);
      });
      mermaid.initialize({ startOnLoad: false, theme: 'default' });
      await mermaid.run();
    }
  </script>
</body>
</html>
